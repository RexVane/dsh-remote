# dsh-tailscale-serve — bundle patch layer.
#
# A self-registering DSH bundle: this patch is applied as a composition layer
# once `dsh plugin --profile web add dsh-tailscale-serve` reconciles the package
# (its package.json declares `dsh.bundle.patch`). The single row below mounts
# the plugin.
#
# Activation order is guaranteed by the plugin's code-level injection:
#   inject: ["webServer", "webRuntime"]
#   - `webServer`  -> apply() runs only after the HTTP server has bound its
#     port, so the serve command targets the real listening port
#     (incl. an OS-assigned port 0).
#   - `webRuntime` -> the web-app bundle's LAN-trust service already exists,
#     so the plugin can append the tailnet hostname to
#     webRuntime.trustedHosts — the exact array DSH's /api browser-trust
#     fence reads (same reference, per request). Without this, the phone's
#     requests would be refused with 403 and the chat would appear
#     "not real-time".
#
# This plugin targets the web profile only; a non-web profile has no
# webRuntime service and fails injection fast, which is correct for a
# web-GUI-only plugin.

- insert:
    - id: tailscale-serve
      name: 'dsh-tailscale-serve'
      config:
        # Master switch. Set false to keep DSH on loopback only.
        enabled: true
        # Terminate TLS via Tailscale (default). Set false to request an
        # explicit plain-HTTP Serve endpoint; HTTPS is strongly recommended.
        https: true
        # Optional tailnet DNS hostname. Omit it for portable auto-discovery
        # through `tailscale status --json`; set it only when this package is
        # deliberately pinned to one machine/tailnet.
        # hostname: 'machine.example-tailnet.ts.net'
        # Leave the plugin's Serve configuration in place after DSH exits.
        # Default false: a normal shutdown removes only the root handler that
        # this plugin added, using Tailscale's ETag concurrency guard.
        keepOnExit: false
        # Optional: override the whole `tailscale` arg vector with compatible
        # listener flags, e.g.
        #   serveArgs: ["serve", "--bg", "--yes", "--https=443",
        #               "http://127.0.0.1:3080"]
        # The override must explicitly select exactly one matching HTTP(S)
        # listener, stay in background mode, and end with the actual DSH target.
        # Service/path/TCP/TUN modes are rejected because this plugin cannot
        # safely own and remove them. The resulting node-level route is verified
        # before success is reported. When omitted, arguments are generated.
        # serveArgs: []

# Keep dsh-web-app's stock `directory-picker-auto` entry intact. On this
# loopback-bound Windows host it composes the native backend and native client,
# so the PC at 127.0.0.1 keeps DeepSeek Harness's original OS folder dialog.
#
# The plugin client shadows that native directory-flow only on a non-loopback
# page (the phone's Tailscale URL). Its directory list/create operations use the
# plugin's own `/tailscale-serve` trusted RPC channel, so the Host can retain the
# native picker capability while the phone gets the in-page "This PC" browser.
